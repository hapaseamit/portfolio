<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HAPASE</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #050510;
        color: white;
      }

      /* Animated background */
      .background {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 20% 30%, #32106f 0%, transparent 35%),
          radial-gradient(circle at 80% 70%, #063c70 0%, transparent 35%),
          linear-gradient(135deg, #050510, #0b0920, #050510);
        animation: backgroundMove 10s ease-in-out infinite alternate;
      }

      @keyframes backgroundMove {
        0% {
          transform: scale(1);
          filter: hue-rotate(0deg);
        }

        100% {
          transform: scale(1.08);
          filter: hue-rotate(25deg);
        }
      }

      /* Grid */
      .grid {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.035) 1px,
            transparent 1px
          );
        background-size: 50px 50px;
        mask-image: radial-gradient(circle, black 30%, transparent 80%);
      }

      /* Center content */
      .container {
        position: relative;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 5;
      }

      .content {
        width: min(100%, 100vw);
        padding-inline: clamp(16px, 5vw, 48px);
        text-align: center;
      }

      .title {
        font-size: clamp(3.5rem, 14vw, 11.875rem);
        font-weight: 900;
        letter-spacing: 0.08em;

        background: linear-gradient(90deg, #ffffff, #a78bfa, #38bdf8, #ffffff);

        background-size: 300% auto;

        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;

        animation:
          gradient 5s linear infinite,
          floating 4s ease-in-out infinite;

        text-shadow:
          0 0 20px rgba(139, 92, 246, 0.4),
          0 0 60px rgba(56, 189, 248, 0.2);
      }

      @keyframes gradient {
        to {
          background-position: 300% center;
        }
      }

      @keyframes floating {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-12px);
        }
      }

      .subtitle {
        margin-top: 20px;
        font-size: clamp(0.625rem, 1.5vw, 0.875rem);
        letter-spacing: clamp(2px, 0.7vw, 7px);
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
        animation: fadeIn 2s ease forwards;
        max-width: 90vw;
        overflow-wrap: anywhere;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Glowing orb */
      .orb {
        position: absolute;
        width: clamp(160px, 28vw, 280px);
        height: clamp(160px, 28vw, 280px);
        border-radius: 50%;

        background: radial-gradient(
          circle,
          rgba(139, 92, 246, 0.25),
          transparent 70%
        );

        filter: blur(20px);
        animation: orbMove 8s ease-in-out infinite;
      }

      .orb.one {
        top: 10%;
        left: 10%;
      }

      .orb.two {
        bottom: 5%;
        right: 10%;
        animation-delay: -4s;
      }

      @keyframes orbMove {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }

        50% {
          transform: translate(50px, -40px) scale(1.3);
        }
      }

      /* Particles */
      .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: white;
        box-shadow: 0 0 10px white;
        animation: particleMove linear infinite;
      }

      @keyframes particleMove {
        from {
          transform: translateY(110vh);
          opacity: 0;
        }

        20% {
          opacity: 1;
        }

        80% {
          opacity: 1;
        }

        to {
          transform: translateY(-10vh);
          opacity: 0;
        }
      }

      /* Bottom glow */
      .bottom-glow {
        position: fixed;
        bottom: -250px;
        left: 50%;
        transform: translateX(-50%);

        width: min(700px, 100vw);
        height: min(400px, 55vw);

        background: #6d28d9;
        opacity: 0.15;
        filter: blur(100px);
        border-radius: 50%;
      }

      /* Simple magical cursor sparkles */
      .magic-spark {
        position: fixed;
        width: 3px;
        height: 3px;
        pointer-events: none;
        z-index: 9999;
        border-radius: 50%;
        background: white;
        box-shadow:
          0 0 5px rgba(255, 255, 255, 1),
          0 0 11px rgba(190, 210, 255, 0.95),
          0 0 19px rgba(139, 92, 246, 0.7);
        animation: magicSpark 850ms ease-out forwards;
        will-change: transform, opacity;
      }

      @keyframes magicSpark {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.2);
        }
        12% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
            scale(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .magic-spark {
          display: none !important;
        }
      }

      /* Responsive layout */
      @media (max-width: 600px) {
        .container {
          min-height: 100svh;
          padding-inline: 12px;
        }

        .content {
          padding-inline: 8px;
        }

        .title {
          font-size: clamp(3rem, 18vw, 5rem);
          letter-spacing: 0.025em;
          line-height: 0.95;
          overflow-wrap: anywhere;
        }

        .subtitle {
          margin-top: 14px;
          font-size: clamp(0.55rem, 2.5vw, 0.75rem);
          letter-spacing: clamp(2px, 1.2vw, 4px);
          line-height: 1.4;
        }

        .grid {
          background-size: 32px 32px;
        }

        .orb.one {
          top: 5%;
          left: -15%;
        }

        .orb.two {
          bottom: 0;
          right: -15%;
        }

        .bottom-glow {
          bottom: -180px;
          height: 300px;
        }
      }

      @media (max-width: 380px) {
        .title {
          font-size: clamp(2.7rem, 17vw, 4.25rem);
        }

        .content {
          padding-inline: 4px;
        }
      }

      @media (min-width: 601px) and (max-width: 1024px) {
        .title {
          font-size: clamp(5rem, 15vw, 9rem);
        }

        .content {
          padding-inline: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="background"></div>
    <div class="grid"></div>

    <div class="orb one"></div>
    <div class="orb two"></div>

    <div class="bottom-glow"></div>

    <div class="container">
      <div class="content">
        <h1 class="title">HAPASE</h1>
      </div>
    </div>

    <script>
      // Generate floating particles
      const particleCount = 80;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement("div");

        particle.classList.add("particle");

        particle.style.left = Math.random() * 100 + "%";
        particle.style.animationDuration = 5 + Math.random() * 10 + "s";

        particle.style.animationDelay = Math.random() * 10 + "s";

        particle.style.opacity = 0.2 + Math.random() * 0.8;

        document.body.appendChild(particle);
      }

      // Slight mouse movement effect (desktop/pointer devices only)
      if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        const title = document.querySelector(".title");

        document.addEventListener("mousemove", (event) => {
          const x = (event.clientX / window.innerWidth - 0.5) * 20;
          const y = (event.clientY / window.innerHeight - 0.5) * 20;

          title.style.transform = `translate(${x}px, ${y}px)`;
        });
      }

      // Continuous magical sparkling trail.
      // Sparkles keep appearing even when the pointer is stationary.
      if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let previousX = mouseX;
        let previousY = mouseY;

        let moveX = 0;
        let moveY = -1;
        let lastSpark = 0;
        let lastMoveTime = 0;

        document.addEventListener("mousemove", (event) => {
          mouseX = event.clientX;
          mouseY = event.clientY;

          const dx = mouseX - previousX;
          const dy = mouseY - previousY;
          const distance = Math.hypot(dx, dy);

          if (distance > 1.2) {
            moveX = dx / distance;
            moveY = dy / distance;
            previousX = mouseX;
            previousY = mouseY;
            lastMoveTime = performance.now();
          }
        });

        function emitSpark() {
          const now = performance.now();

          // Dense continuous sparkle stream.
          // It remains active at rest and becomes even denser while moving.
          const moving = now - lastMoveTime < 100;
          const interval = moving ? 10 : 18;

          if (now - lastSpark >= interval) {
            // Emit 1–2 sparks per cycle for a fuller trail.
            const count = moving
              ? Math.random() < 0.65
                ? 2
                : 1
              : Math.random() < 0.35
                ? 2
                : 1;

            for (let i = 0; i < count; i++) {
              const spark = document.createElement("span");
              spark.className = "magic-spark";

              // Keep stationary sparkles close to the pointer.
              // When moving, place them slightly behind it.
              const behind = moving
                ? 2 + Math.random() * 10
                : Math.random() * 6;

              const side = (Math.random() - 0.5) * 16;

              spark.style.left = mouseX - moveX * behind + -moveY * side + "px";
              spark.style.top = mouseY - moveY * behind + moveX * side + "px";

              // Drift backward along the same movement direction.
              const travel = moving
                ? 14 + Math.random() * 34
                : 4 + Math.random() * 14;

              const sideways = (Math.random() - 0.5) * (moving ? 14 : 20);

              spark.style.setProperty(
                "--dx",
                -moveX * travel + -moveY * sideways + "px",
              );
              spark.style.setProperty(
                "--dy",
                -moveY * travel + moveX * sideways + "px",
              );

              const size = 1.5 + Math.random() * 3.8;
              spark.style.width = size + "px";
              spark.style.height = size + "px";

              // Slightly vary sparkle brightness through opacity.
              spark.style.opacity = 0.65 + Math.random() * 0.35;

              document.body.appendChild(spark);
              spark.addEventListener("animationend", () => spark.remove());
            }

            lastSpark = now;
          }

          requestAnimationFrame(emitSpark);
        }

        emitSpark();
      }
    </script>
  </body>
</html>
